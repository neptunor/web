faqs:
  - q: Where is your company and factory located?
    a: >-
      Neptunor is an OEM/ODM manufacturer of RIB boats and inflatable boats
      based in Qingdao, China. Our 12,500 m² manufacturing plant sits in the
      Laixi Economic Development Zone and has been building inflatables since
      2012. Sales and technical support are global; production is in Qingdao,
      China.
  - q: Does Neptunor provide OEM/ODM services for RIB and inflatable boats?
    a: >-
      Yes. Neptunor offers full-scale OEM and ODM manufacturing — from hull and
      console engineering, tube fabric selection and colorways through to serial
      production for brands, rental operators and government tenders. We handle
      private labeling, custom packaging and compliance documentation, including
      CE support files for EU markets.
  - q: What certifications does Neptunor hold for inflatable boat manufacturing?
    a: >-
      Our factory operates under an ISO 9001 quality system. Boats bound for EU
      markets are certified to the EU Recreational Craft Directive 2013/53/EU in
      design categories C and D, with construction verified against ISO 6185 for
      inflatable boats. Certification scope is confirmed per project and varies
      by target market and boat configuration; REACH documentation for tube
      fabrics is available on request.
  - q: What is the minimum order quantity (MOQ) for OEM RIB and inflatable boat projects?
    a: >-
      MOQ follows the project stage rather than one fixed number. Samples run at
      1–2 units. Small-batch co-branding starts at 5–10 units. Pilot production
      runs 20–50 units, and standard volume production runs 90–100+ units per
      approved configuration. Projects that require new hull or console tooling
      start at 50–100+ units, and the tooling adds 20–35 days to the schedule.
  - q: Which materials does Neptunor use for tubes and hulls?
    a: >-
      Tubes are built from high-tenacity marine PVC fabric (typically
      0.9 mm–1.2 mm) with UV stabilizers, or from CSM (Hypalon®) fabric for
      professional fleets that demand maximum chemical and UV resistance.
      Hulls are welded marine-grade aluminum or hand-laid fiberglass. All
      materials are sourced from certified suppliers and tested for tensile
      strength, UV resistance and low-temperature flexibility before production.
  - q: Can Neptunor handle large-volume wholesale orders for international buyers?
    a: >-
      Yes. Our 12,500 m² plant turns out high volumes of tube sets and hulls
      every year with a dedicated production workforce, and we ship to 50+
      countries. We manage logistics including FOB Qingdao, CIF to major ports,
      and door-to-door delivery through our freight partners.
  - q: What are your lead times for samples and production orders?
    a: >-
      Prototype samples ship within 10–15 days once the specification is frozen.
      Standard production lead time is 30–45 days from confirmed PO and deposit,
      depending on configuration and volume. New hull or console tooling adds
      20–35 days. Rush schedules can be discussed for established partners with
      confirmed material stock.
  - q: Should we specify an aluminum or fiberglass hull for our program?
    a: >-
      Welded marine-aluminum hulls suit tender, utility, dive and patrol duty:
      they are light, impact-tolerant, beachable and straightforward to repair.
      Fiberglass hulls deliver a glossier finish and lower tooling cost for
      larger series built on stable designs. Both platforms share the same tube
      systems, consoles and QC process — hull choice is reviewed against your
      duty cycle, budget and market before sampling.
  - q: How do you verify air-tightness before shipment?
    a: >-
      Every tube chamber undergoes a 24-hour pressure-hold test at 0.35 bar. Any
      chamber showing a pressure drop greater than 0.02 bar over the hold period
      is rejected and rebuilt. Results are logged against each serial number, so
      the pressure record for your batch exists long after the boats have
      shipped.
  - q: What does your 120-point assembly checklist cover?
    a: >-
      Every boat passes a 120-point checklist covering hull integrity, weld and
      seam quality, valve seating, transom bonding, console fit, fuel and
      electrical routing where fitted, hardware torque, graphics placement and
      cosmetic finish. No unit leaves final assembly until every line item is
      signed off by the shift supervisor.
  - q: How is quality controlled through production?
    a: >-
      Production moves through seven QC gates (Node 01 through Node 07), from
      incoming fabric verification through cutting, welding and assembly to
      final pressure-hold, packaging audit and pre-shipment inspection. Each
      gate has defined acceptance criteria and recorded evidence, so issues are
      caught at the stage where they originate rather than at the loading dock.
  - q: Is there traceability for materials and production records?
    a: >-
      Yes. Every hull and tube set carries a serial number linked to fabric
      batch numbers, weld operator, assembly station and test records. Records
      are retained for 10 years, which supports warranty handling, spare-part
      matching and any market-surveillance queries from distributors or
      authorities.
  - q: How are production batches inspected before release?
    a: >-
      Finished batches are inspected by attribute sampling to ISO 2859-1 Level
      II. The acceptable quality limit applied to your order is written into the
      contract, so both sides agree in advance what happens if a sample fails —
      rework, re-inspection or rejection of the lot.
  - q: Can we appoint third-party inspection before shipment?
    a: >-
      Yes, and we encourage it for first orders. SGS, TÜV, BV, Intertek or your
      own inspector are all welcome at final inspection. We coordinate the
      booking, provide our internal inspection protocol and make test records
      available, so the third-party report maps directly onto our QC evidence.
  - q: How does CE certification work for inflatable boats under the RCD?
    a: >-
      For EU-bound boats we certify to the Recreational Craft Directive
      2013/53/EU in design category C (inshore) or D (sheltered waters), as hull
      length and configuration allow. Construction follows ISO 6185 for
      inflatable boats. Each boat receives its builder's plate, hull
      identification number and owner's manual in the required languages, and we
      supply the EU declaration of conformity plus technical-file support for
      your import records.
  - q: What is the difference between OEM, ODM and private label?
    a: >-
      OEM means we manufacture to your approved specification — your drawings,
      dimensions, materials and branding; you own the design and intellectual
      property. ODM means our engineering team develops the boat from your brief
      — a market concept, a duty profile or an adaptation of a proven platform —
      and you approve before production. Private label means your brand, colors,
      graphics and packaging on an existing validated platform with no
      structural changes. Most projects land between these modes, and we quote
      the configuration that matches how much of the design you want to own.
  - q: What payment terms do you apply to production orders?
    a: >-
      Typical terms are a 30% deposit to lock the production slot with the 70%
      balance due before shipment — typical, confirmed per contract rather than
      fixed policy. T/T is standard; L/C at sight can be discussed for
      established partners. The deposit percentage, balance timing and currency
      are stated in every quotation, so nothing is discovered later.
  - q: Do you accept factory visits and buyer audits?
    a: >-
      Absolutely. We welcome on-site visits, virtual tours and third-party
      audits, including customer-specific quality and social-compliance
      inspections. The plant is audit-ready with documented QC processes,
      material traceability and worker health & safety records. Many buyers
      combine a visit with sea trials of current sample boats.
  - q: Do you sell to consumers or end users?
    a: >-
      No. Neptunor is strictly B2B: we manufacture for brands, dealers, rental
      and resort fleets, rescue organizations and institutional buyers, and we
      do not sell single units to consumers. Trade inquiries are handled via
      info@neptunor.com or the inquiry form on this site.
  - q: What export documentation do you provide with each shipment?
    a: >-
      Each shipment includes the commercial invoice, packing list, bill of
      lading and certificate of origin, plus CE documentation where applicable.
      We mark and barcode cartons to your market requirements and can split
      documents across consolidated orders. Whether your forwarder or ours ships
      the cargo, the document set is agreed before the container is booked.
  - q: How many boats fit in a container?
    a: >-
      Inflatable dinghies ship deflated in retail cartons; RIBs ship
      frame-packed or rack-loaded depending on hull size. Counts vary widely
      with model mix, console type and packaging design, so our logistics team
      calculates the load plan from your actual bill of materials — the number
      you plan against is the number that ships.
  - q: What spare parts do you supply for fleets?
    a: >-
      Fleet operators can order serviceable parts together with their boats or
      on standing replenishment cycles: replacement valves, PVC or CSM repair
      patches and adhesive, tube sections, floor panels, oars, pump and console
      hardware, and common consumables. Spare parts ship alongside production or
      as small consignments, so a damaged component never keeps a whole boat out
      of service for long.
  - q: How much does a prototype sample cost, and can the fee be applied to the order?
    a: >-
      Sample pricing follows the project configuration: hull type, length, tube
      fabric, console and packaging all affect the quote. For projects that move
      to volume production, the sample fee is typically credited against the
      first production order — the credit terms are confirmed in writing at
      quotation stage so there are no surprises later.
  - q: What warranty do you provide on bulk orders?
    a: >-
      Every boat passes the 24-hour pressure-hold test and the full final
      inspection before shipment, and warranty terms are written into each order
      contract. They cover manufacturing defects such as seam failure, weld
      porosity and valve leaks, and exclude use-related damage. The warranty
      period and claim procedure are confirmed on the purchase order, not
      discovered later.
  - q: What happens if boats arrive damaged or with manufacturing defects?
    a: >-
      Report the issue within the agreed window (typically 7–15 days of arrival)
      with photos or video evidence. We assess the claim against the
      pre-shipment inspection records kept for your batch — including the
      pressure logs — then rework, replace or credit accordingly. Documented QC
      photos of your stock make this fast and fair for both sides.
  - q: How is custom artwork and livery approved before production?
    a: >-
      Graphics go through a controlled approval chain: digital mockup, printed
      proof on the actual tube fabric, first-article inspection on the
      production boat, then batch application. Each step is checked against your
      signed artwork, which is why hull colors, collar graphics and logo
      placement match your brand file when the boats land.
  - q: What information should I prepare before requesting a quote?
    a: >-
      The better the brief, the faster the quote: target market and usage
      (tender, rental, resort, rescue, patrol), desired specifications (length,
      hull material, tube fabric, console type), quantity and target price,
      certification destination, branding needs, and your launch timeline. Our
      inquiry form collects exactly this list — sharing it saves quotation
      rounds and gets you a firmer estimate on the first pass.
  - q: How long does sampling take before production?
    a: >-
      Prototype samples ship within 10–15 days once the specification is frozen.
      Add review time for your testing and any revision round — most projects
      complete sampling in two to three weeks. Production starts only after
      written sample approval, so extra care at this stage pays back in time
      saved later.

faqs:
  - q: ¿Dónde están ubicadas su empresa y su fábrica?
    a: >-
      Neptunor es un fabricante OEM/ODM de embarcaciones RIB y neumáticas con
      sede en Qingdao, China. Nuestra planta de fabricación de 12.500 m² está
      en la Zona de Desarrollo Económico de Laixi y construye inflables desde
      2012. El soporte comercial y técnico es global; la producción está en
      Qingdao, China.
  - q: ¿Ofrece Neptunor servicios OEM/ODM para RIB y embarcaciones neumáticas?
    a: >-
      Sí. Neptunor ofrece fabricación OEM y ODM a gran escala — desde la
      ingeniería del casco y la consola, la selección del tejido de los tubos y
      los colores, hasta la producción en serie para marcas, operadores de
      alquiler y licitaciones institucionales. Gestionamos la etiqueta privada,
      el embalaje personalizado y la documentación de cumplimiento, incluidos
      los expedientes CE para mercados de la UE.
  - q: ¿Qué certificaciones mantiene Neptunor para la fabricación de embarcaciones neumáticas?
    a: >-
      Nuestra fábrica opera bajo un sistema de calidad ISO 9001. Las embarcaciones
      destinadas a mercados de la UE se certifican conforme a la Directiva Europea
      de Embarcaciones de Recreo 2013/53/EU en categorías de diseño C y D, con la
      construcción verificada según ISO 6185 para embarcaciones neumáticas. El
      alcance se confirma por proyecto y varía según el mercado de destino y la
      configuración; la documentación REACH de los tejidos está disponible bajo
      petición.
  - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para proyectos OEM de RIB y neumáticas?
    a: >-
      El MOQ sigue la etapa del proyecto, no un número fijo. Las muestras son de
      1–2 unidades. El co-branding en lotes pequeños parte de 5–10 unidades. La
      producción piloto abarca 20–50 unidades y la producción en volumen estándar
      ronda las 90–100+ unidades por configuración aprobada. Los proyectos que
      requieren utillaje nuevo de casco o consola parten de 50–100+ unidades, y
      el utillaje añade 20–35 días al calendario.
  - q: ¿Qué materiales utiliza Neptunor para tubos y cascos?
    a: >-
      Los tubos se construyen con tejido de PVC marino de alta tenacidad
      (normalmente 0,9 mm–1,2 mm) con estabilizadores UV, o con tejido CSM
      (Hypalon®) para flotas profesionales que exigen máxima resistencia química
      y a los rayos UV. Los cascos son de aluminio marino soldado o de fibra de
      vidrio laminada a mano. Todos los materiales provienen de proveedores
      cualificados y se ensayan en cuanto a resistencia a la tracción,
      resistencia UV y flexibilidad a baja temperatura antes de la producción.
  - q: ¿Puede Neptunor gestionar pedidos mayoristas de gran volumen para compradores internacionales?
    a: >-
      Sí. Nuestra planta de 12.500 m² produce grandes volúmenes de juegos de
      tubos y cascos cada año con un equipo de producción dedicado, y enviamos a
      más de 50 países. Gestionamos la logística, incluidos FOB Qingdao, CIF a
      los principales puertos y entrega puerta a puerta a través de nuestros
      socios de transporte.
  - q: ¿Cuáles son sus plazos de entrega para muestras y pedidos de producción?
    a: >-
      Las muestras de prototipo se envían en 10–15 días una vez congelada la
      especificación. El plazo estándar de producción es de 30–45 días desde la
      confirmación del pedido y el depósito, según configuración y volumen. El
      utillaje nuevo de casco o consola añade 20–35 días. Los calendarios
      urgentes pueden analizarse para socios establecidos con stock de material
      confirmado.
  - q: ¿Deberíamos especificar un casco de aluminio o de fibra de vidrio para nuestro programa?
    a: >-
      Los cascos de aluminio marino soldado encajan en labores de auxiliar,
      utilitario, buceo y patrulla: son ligeros, tolerantes a impactos, aptos
      para varar y fáciles de reparar. Los cascos de fibra de vidrio aportan un
      acabado brillante y un utillaje de menor coste para series grandes sobre
      diseños consolidados. Ambas plataformas comparten los mismos sistemas de
      tubos, consolas y proceso de control de calidad — la elección del casco se
      revisa contra tu ciclo de uso, presupuesto y mercado antes del muestreo.
  - q: ¿Cómo verifican la estanqueidad antes del envío?
    a: >-
      Cada cámara de los tubos pasa un ensayo de retención de presión de 24 horas
      a 0.35 bar. Toda cámara con una caída superior a 0.02 bar durante el periodo
      de retención se rechaza y se reconstruye. Los resultados se registran contra
      cada número de serie, de modo que el registro de presión de tu lote existe
      mucho después del envío.
  - q: ¿Qué cubre su lista de verificación de montaje de 120 puntos?
    a: >-
      Cada embarcación supera una lista de verificación de 120 puntos que cubre
      la integridad del casco, la calidad de soldaduras y costuras, el asiento de
      las válvulas, la unión de la espejo de popa, el ajuste de la consola, el
      enrutado de combustible y electricidad cuando aplica, el par de apriete de
      herrajes, la colocación de gráficos y el acabado estético. Ninguna unidad
      sale del montaje final hasta que el supervisor de turno firma cada punto.
  - q: ¿Cómo se controla la calidad durante la producción?
    a: >-
      La producción avanza a través de siete puertas de control de calidad (Nodo
      01 a Nodo 07), desde la verificación del tejido entrante pasando por corte,
      soldadura y montaje, hasta la retención de presión final, la auditoría de
      embalaje y la inspección previa al envío. Cada puerta tiene criterios de
      aceptación definidos y evidencias registradas, de forma que los problemas
      se detectan en la etapa donde se originan y no en el muelle de carga.
  - q: ¿Existe trazabilidad de materiales y registros de producción?
    a: >-
      Sí. Cada casco y juego de tubos lleva un número de serie vinculado a los
      lotes de tejido, al soldador, a la estación de montaje y a los registros de
      ensayo. Los registros se conservan durante 10 años, lo que respalda la
      gestión de garantías, la búsqueda de repuestos y cualquier consulta de
      vigilancia de mercado de distribuidores o autoridades.
  - q: ¿Cómo se inspeccionan los lotes de producción antes de su liberación?
    a: >-
      Los lotes terminados se inspeccionan por muestreo por atributos según
      ISO 2859-1 Nivel II. El límite de calidad aceptable aplicado a tu pedido se
      escribe en el contrato, así que ambas partes acuerdan por adelantado qué
      ocurre si una muestra falla — reproceso, reinspección o rechazo del lote.
  - q: ¿Podemos designar una inspección de terceros antes del envío?
    a: >-
      Sí, y la recomendamos en los primeros pedidos. SGS, TÜV, BV, Intertek o tu
      propio inspector son bienvenidos en la inspección final. Coordinamos la
      reserva, facilitamos nuestro protocolo interno de inspección y ponemos a
      disposición los registros de ensayo, de modo que el informe del tercero se
      corresponda directamente con nuestras evidencias de control de calidad.
  - q: ¿Cómo funciona la certificación CE para embarcaciones neumáticas bajo la RCD?
    a: >-
      Para embarcaciones con destino a la UE certificamos conforme a la Directiva
      de Embarcaciones de Recreo 2013/53/EU en categoría de diseño C (navegación
      costera) o D (aguas abrigadas), según permitan la eslora y la configuración.
      La construcción sigue la ISO 6185 para embarcaciones neumáticas. Cada
      embarcación recibe su placa del constructor, número de identificación del
      casco y manual del propietario en los idiomas requeridos, y suministramos
      la declaración UE de conformidad junto al soporte del expediente técnico
      para tus registros de importación.
  - q: ¿Cuál es la diferencia entre OEM, ODM y etiqueta privada?
    a: >-
      OEM significa que fabricamos según tu especificación aprobada — tus
      planos, dimensiones, materiales y marca; tú eres dueño del diseño y la
      propiedad intelectual. ODM significa que nuestro equipo de ingeniería
      desarrolla la embarcación a partir de tu brief — un concepto de mercado, un
      perfil de uso o una adaptación de una plataforma probada — y tú apruebas
      antes de producir. Etiqueta privada significa tu marca, colores, gráficos y
      embalaje sobre una plataforma existente validada sin cambios estructurales.
      La mayoría de los proyectos queda entre estos modos, y presupuestamos la
      configuración que encaja con cuánto del diseño quieres controlar.
  - q: ¿Qué condiciones de pago aplican a los pedidos de producción?
    a: >-
      Las condiciones típicas son un depósito del 30 % para reservar la plaza de
      producción y el 70 % restante antes del embarque — cifras típicas, que se
      confirman por contrato y no como política fija. La transferencia T/T es lo
      estándar; el L/C a la vista puede analizarse para socios establecidos. El
      porcentaje del depósito, el calendario del saldo y la moneda figuran en
      cada cotización, sin sorpresas posteriores.
  - q: ¿Aceptan visitas a fábrica y auditorías de compradores?
    a: >-
      Por supuesto. Damos la bienvenida a visitas presenciales, recorridos
      virtuales y auditorías de terceros, incluidas inspecciones de calidad y de
      cumplimiento social específicas del cliente. La planta está lista para
      auditorías con procesos de control de calidad documentados, trazabilidad de
      materiales y registros de salud y seguridad laboral. Muchos compradores
      combinan la visita con pruebas de mar de las muestras actuales.
  - q: ¿Venden a consumidores o usuarios finales?
    a: >-
      No. Neptunor trabaja exclusivamente B2B: fabricamos para marcas,
      distribuidores, flotas de alquiler y resorts, organizaciones de rescate e
      instituciones, y no vendemos unidades sueltas a consumidores. Las consultas
      comerciales se gestionan vía info@neptunor.com o mediante el formulario de
      consulta de este sitio.
  - q: ¿Qué documentación de exportación entregan con cada envío?
    a: >-
      Cada envío incluye factura comercial, lista de empaque, conocimiento de
      embarque y certificado de origen, además de la documentación CE cuando
      aplica. Marcamos y codificamos los cartones según los requisitos de tu
      mercado y podemos dividir documentos en pedidos consolidados. Tu agente de
      carga o el nuestro transporta la mercancía; el set documental se acuerda
      antes de reservar el contenedor.
  - q: ¿Cuántas embarcaciones caben en un contenedor?
    a: >-
      Las neumáticas viajan desinfladas en cartones retail; los RIB viajan
      enfundados en bastidor o en racks según la eslora del casco. Las cantidades
      varían mucho con la mezcla de modelos, el tipo de consola y el diseño del
      embalaje, así que nuestro equipo logístico calcula el plan de carga a
      partir de tu lista de materiales real — el número con el que planificas es
      el número que se envía.
  - q: ¿Qué piezas de repuesto suministran para flotas?
    a: >-
      Los operadores de flotas pueden pedir piezas reparables junto con sus
      embarcaciones o en ciclos de reposición programados: válvulas de repuesto,
      parches y adhesivo de PVC o CSM, tramos de tubo, paneles de suelo, remos,
      hinchadores y herrajes de consola, y consumibles habituales. Los repuestos
      viajan junto con la producción o en pequeños envíos, de modo que un
      componente dañado nunca deja una embarcación entera fuera de servicio
      durante mucho tiempo.
  - q: ¿Cuánto cuesta una muestra de prototipo y se puede descontar del pedido?
    a: >-
      El precio de la muestra sigue la configuración del proyecto: tipo de casco,
      eslora, tejido de los tubos, consola y embalaje afectan a la cotización.
      Para proyectos que pasan a producción en volumen, la cuota de muestra suele
      acreditarse contra el primer pedido de producción — las condiciones del
      crédito se confirman por escrito en la fase de cotización para evitar
      sorpresas.
  - q: ¿Qué garantía ofrecen en pedidos por volumen?
    a: >-
      Cada embarcación supera el ensayo de retención de presión de 24 horas y la
      inspección final completa antes del envío, y las condiciones de garantía se
      escriben en cada contrato de pedido. Cubren defectos de fabricación como
      fallos de costura, porosidad de soldadura y fugas de válvula, y excluyen
      daños por uso. El período de garantía y el procedimiento de reclamación se
      confirman en la orden de compra, no se descubren después.
  - q: ¿Qué pasa si las embarcaciones llegan dañadas o con defectos de fabricación?
    a: >-
      Informa del problema dentro del plazo acordado (normalmente 7–15 días desde
      la llegada) con fotos o vídeo como prueba. Evaluamos la reclamación contra
      los registros de inspección pre-envío de tu lote — incluidos los registros
      de presión — y luego reparamos, repone o abonamos en consecuencia. Las
      fotos documentadas de control de calidad hacen que el proceso sea rápido y
      justo para ambas partes.
  - q: ¿Cómo se aprueba el arte personalizado y la librea antes de la producción?
    a: >-
      Los gráficos pasan por una cadena de aprobación controlada: mockup digital,
      prueba impresa sobre el tejido real de los tubos, inspección de primera
      pieza sobre la embarcación de producción y después aplicación en serie.
      Cada paso se comprueba contra tu arte firmado, por eso los colores del
      casco, los gráficos del collar y la colocación del logotipo coinciden con
      tu archivo de marca cuando llegan las embarcaciones.
  - q: ¿Qué información debería preparar antes de solicitar una cotización?
    a: >-
      Cuanto mejor sea el brief, más rápida la cotización: mercado objetivo y uso
      (auxiliar, alquiler, resort, rescate, patrulla), especificaciones deseadas
      (eslora, material del casco, tejido de los tubos, tipo de consola),
      cantidad y precio objetivo, destino de certificación, necesidades de marca
      y calendario de lanzamiento. Nuestro formulario de consulta recoge
      exactamente esta lista — compartirla ahorra rondas de cotización y te da
      una estimación más firme a la primera.
  - q: ¿Cuánto tarda el muestreo antes de la producción?
    a: >-
      Las muestras de prototipo se envían en 10–15 días desde que se congela la
      especificación. Añade el tiempo de revisión para tus pruebas y cualquier
      ronda de ajustes — la mayoría de los proyectos completa el muestreo en dos
      o tres semanas. La producción comienza solo tras la aprobación escrita de
      la muestra, así que el cuidado extra en esta etapa se traduce en tiempo
      ahorrado más adelante.

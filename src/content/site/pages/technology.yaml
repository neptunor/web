meta:
  title: 'Technology — Drop Stitch & Marine PVC | {SITE}'
  description: 'Neptunor technologies: drop stitch construction, marine PVC, double-layer builds, and high pressure. Innovation from a professional inflatable boat manufacturer.'
  dateModified: '2026-08'
  keywords:
    - 'boat technology'
    - 'drop stitch construction'
    - 'high pressure boat'
    - 'inflatable boat materials'
hero:
  tagline: Technology
  title: Built for Performance
  subtitle: Every Neptunor inflatable boat is engineered with drop-stitch construction and marine-grade PVC —precision materials and manufacturing methods tested for demanding marine environments.

sections:
  - title: Drop-Stitch Core
    description: Thousands of internal polyester threads connect the top and bottom layers, creating a rigid structure at 0.25 bar working pressure. This is the same technology used in professional boats and inflatable racing boats.
    imageAlt: DS Core Diagram
  - title: Marine-Grade PVC
    description: Multi-layer laminated PVC fabric rated for marine environments. Each layer is fusion-welded rather than glued, eliminating delamination risks. Tested for UV resistance, saltwater corrosion, and abrasion.
    imageAlt: PVC Layer
  - title: Military-Grade PVC
    description: Used on all boat models, premium PVC provides superior UV and chemical resistance. Maintains flexibility in extreme temperatures and resists degradation.
    imageAlt: PVC
  - title: Air Deck Floor
    description: High-pressure inflatable drop-stitch construction providing exceptional rigidity for walkable decks, fishing platforms and seating. Reduces setup time, overall weight, and storage volume.
    imageAlt: Air Deck


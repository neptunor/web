  title: 'Añade soporte posventa a tu programa de RIB'
  subtitle: 'Envía tu mezcla de modelos, tamaño de flota, mercado objetivo y expectativas de servicio. Neptunor ayudará a definir un paquete práctico de repuestos y documentación para tu proyecto.'
  actions:
    - variant: primary
      text: Hablar sobre soporte de servicio
      href: /es/contact#project-brief
    - text: Revisar la guía de garantía
      href: /es/warranty
    - text: Revisar evidencias de trazabilidad
      href: /es/resources/rib-traceability-evidence

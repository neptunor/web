meta:
  title: 'Guía de posventa y repuestos para RIB | Neptunor'
  description: 'Planifica garantía, repuestos, registros de reparación y soporte para RIB y embarcaciones inflables destinadas a flotas, distribuidores y operadores comerciales.'
  dateModified: '2026-09-03'
  keywords:
    - 'repuestos RIB'
    - 'soporte posventa embarcación inflable'
    - 'planificación garantía RIB'
    - 'repuestos para flotas náuticas'

hero:
  tagline: 'Planificación posventa'
  title: 'Mantén cada RIB y embarcación inflable en servicio'
  subtitle: 'Guía práctica de paquetes de repuestos, registros de garantía, soporte de reparación y controles de reposición para distribuidores, flotas y operadores profesionales.'
  actions:
    - variant: primary
      text: Planificar un paquete de servicio

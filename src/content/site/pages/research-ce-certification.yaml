answer:
  label: 'Straight answer'
  text: 'For an EU-bound RIB or inflatable boat, the applicable conformity route depends on hull length, intended use, design category and final configuration. The project normally requires a technical file, applicable testing, conformity assessment where required and an EU Declaration of Conformity; scope, timing and cost must be confirmed with the responsible manufacturer and conformity-assessment body.'
  verified: '2026-08'

content_html: |
  <h2>What Is CE Certification?</h2>
  <p>CE marking (Conformit&eacute; Europ&eacute;enne) indicates that a product meets EU health, safety, and environmental requirements. For inflatable watercraft, the relevant regulatory framework depends on the product category.</p>

  <h2>Applicable Directives</h2>

  <h3>Recreational Craft Directive (2013/53/EU)</h3>
  <p>The primary directive for most RIB boats and inflatable boats. It applies to recreational craft from 2.5 m to 24 m hull length, partially completed boats (for OEM supply), and personal watercraft.</p>

    <h2>The Certification Process</h2>
  <ol>
    <li>Product classification: Determine craft design category (A – D per ISO 8666)</li>
    <li>Applicable standards: EN ISO 6185 (Parts 1 – 4), EU Recreational Craft Directive 2013/53/EU (HIN), EN ISO 14945 (builder's plate)</li>
    <li>Technical file preparation: Design drawings, Bill of Materials, material certificates, risk assessment</li>
    <li>Type testing: Buoyancy, stability, load capacity, material testing, seam strength, air retention</li>
    <li>Factory production control: Notified body audit of manufacturing processes</li>
    <li>Declaration of Conformity: Manufacturer signs DoC, affixes CE marking</li>
  </ol>

  <h2>Notified Bodies for Inflatable Watercraft</h2>
  <p>Common NBs include Bureau Veritas (France), DNV GL (Germany), RINA (Italy), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Germany).</p>

  <h2>Timeline and Costs</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Phase</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Duration</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Typical Cost (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Technical file preparation</td><td class="p-3 border">2 – 4 weeks</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Type testing</td><td class="p-3 border">4 – 8 weeks</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Factory audit</td><td class="p-3 border">1 – 2 days (on-site)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Total (first product)</td><td class="p-3 border">8 – 14 weeks</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>What This Means for Buyers</h2>
  <p>When purchasing an EU-bound RIB or inflatable boat, verify that the CE marking, applicable conformity documents, builder’s plate, WIN/HIN and owner’s manual all match the exact model and configuration. Request the relevant document list and confirm its scope for the destination market rather than relying on a universal certification statement.</p>

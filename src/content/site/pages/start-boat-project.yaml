what_we_need:
  heading: 'Intake Checklist — What to Prepare'
  body: |
    The more complete your brief, the fewer quotation rounds. Prepare these seven items:

    - **Target market** — country or region of sale; this sets certification scope (EU Recreational Craft Directive 2013/53/EU design categories C/D, ISO 6185, local registrations).
    - **Boat type** — RIB tender, air-deck dinghy, rescue/workboat, rental fleet model, or a custom concept.
    - **Size** — target length and beam, passenger capacity, and tube diameter if known.
    - **Quantity** — first-order estimate and 12-month projection, so we recommend the right MOQ tier.
    - **Certification needs** — CE category, third-party inspections (SGS/TÜV/BV/Intertek), or market-specific documentation.
    - **Branding** — logo placement, hull graphics, console branding, packaging and manuals.
    - **Timeline** — required sample date and launch window, including any trade-show deadline.

faqs:
  tagline: FAQ
  title: 'Starting a Project — Frequently Asked Questions'
  items:
    - q: 'Do I need final drawings before contacting you?'
      a: 'No. A clear description of boat type, size, quantity and market is enough for a first engineering review and budget quotation. Drawings can be developed together in ODM mode or supplied later in OEM mode.'
    - q: 'How quickly will I hear back?'
      a: 'Every brief receives an engineer-reviewed reply within one business day, followed by an itemized quotation typically within three business days once configuration is clear.'
    - q: 'Can you sign an NDA before I share designs?'
      a: 'Yes. We sign NDAs before receiving any proprietary drawings, artwork or specifications, and all project files are stored under access-controlled, audit-traceable systems.'
    - q: 'Who owns the design?'
      a: 'In OEM mode, you do — fully. In ODM mode, platform IP adapted from your brief is settled by agreement before work starts. In private-label mode, the platform stays ours while all brand assets stay yours.'


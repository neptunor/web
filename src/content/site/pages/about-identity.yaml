manufacturing_scope:
  heading: 'Manufacturing Scope'
  body: |
    Our manufacturing scope covers the full production chain for RIB boats and inflatable boats — from raw material incoming inspection through final packaging and export documentation.

    - **Product categories**: RIB boats (hypalon/PVC hull-tube constructions), inflatable dinghies and tenders, air-deck boats, rescue and workboats, plus consoles, seats, pumps and accessories.
    - **Construction types**: Welded PVC tube systems, heat-sealed seams, drop-stitch air-deck floors and panels, fiberglass/RIM consoles and hulls for RIB configurations. Custom construction specifications per project.
    - **Collaboration models**: OEM (buyer-owned design), ODM (factory-developed from buyer brief), private-label/co-branding (brand applied to proven platforms).
    - **Certifications**: ISO 9001:2015 (factory quality management), CE per EU Recreational Craft Directive 2013/53/EU (design categories C/D), ISO 6185, BSCI (social compliance), REACH (chemical safety), RoHS (restricted substances).
    - **Production capacity**: 60,000+ boats annually, ~5,000 boats monthly across 4 automated lines. Scale-up available with advance scheduling.

brand_positioning:
  heading: 'Brand Positioning'
  body: |
    Neptunor occupies a specific position in the market — we are a manufacturer serving professional buyers, not a consumer brand. This distinction shapes every aspect of how we operate:

    - **We never sell under our own brand.** Every boat we produce carries the brand of the buyer. We do not compete with our clients in any market, in any channel. This policy is non-negotiable.
    - **We are not a trading company.** We operate the factory. Quality control, engineering, production scheduling and export documentation are all managed in-house. There are no intermediaries between your order and the production floor.
    - **We specialize in RIB and inflatable boats.** This is not a sideline or one product category among many. Boat and marine products are our core competence. Every machine, every process, every QC gate is optimized for this product category.
    - **We serve professional buyers.** Our clients are brands, distributors, rental and resort operators, dealers and institutions — not individual consumers. Our pricing, MOQ structure, documentation and communication are designed for B2B relationships.

evidence_review:
  tagline: 'Evidence & Verification'
  title: 'SPECIFICATIONS VERIFIED'
  body: 'All organizational and manufacturing claims on this page are verifiable. ISO 9001 certificate, BSCI report, business license and factory registration documents are available on request. Factory visits welcome. Specifications last verified 2026-08.'

faqs:
  tagline: FAQ
  title: 'Brand Identity — Frequently Asked Questions'
  items:
    - q: 'Who is behind the Neptunor brand?'
      a: 'Neptunor is the B2B boat-manufacturing brand of Neptunor Marine Co., Ltd., a standalone manufacturer headquartered in Qingdao, Shandong, China. The legal contracting entity for all orders is Neptunor Marine Co., Ltd. The brand, the factory, the team and the quality system are one operation.'
    - q: 'Do you sell boats under your own brand?'
      a: 'No. We manufacture exclusively under the brands of our clients and never compete with them in any market. This is a core policy — not a temporary position. If you find a Neptunor-branded boat on the consumer market, it is not from our factory.'
    - q: 'Can I visit the factory?'
      a: 'Yes. We welcome factory visits and can arrange a structured audit covering the full production process, QC gates, material warehouse and documentation review. Contact us to schedule a visit.'
    - q: 'What does Neptunor manufacture?'
      a: 'RIB boats and inflatable boats: tenders and dinghies, air-deck models, rescue and commercial workboats, built in PVC or Hypalon tube systems with welded seams, drop-stitch air-deck floors and fiberglass or RIM consoles. All production is OEM, ODM or private-label for professional buyers.'


hero:
  tagline: 'Brand Identity'
  title: 'Who Is Neptunor?'
  subtitle: 'Neptunor is the B2B boat-manufacturing brand of Neptunor Marine Co., Ltd. — a specialized RIB boat and inflatable boat manufacturer in Qingdao, Shandong, China. We manufacture exclusively under the brands of our clients and never compete with them in any market.'

answer:
  label: 'In brief'
  text: 'Legal entity: Neptunor Marine Co., Ltd. Manufacturing brand: Neptunor. Factory: 18,000 m² plant in Qingdao, Shandong, China. Scope: OEM, ODM and private-label manufacturing of RIB boats, inflatable boats and marine inflatables. Certifications: ISO 9001:2015, CE (EU Recreational Craft Directive 2013/53/EU, design categories C/D), ISO 6185, BSCI, REACH, RoHS. We do not sell under our own brand — every boat we produce carries the brand of the buyer.'
  verified: '2026-08'


workshops:
  - title: boat Boat Production
    description: '4 automated assembly lines for inflatable boats with a combined output of about 5,000 boats per month. Digital printing and screen printing stations run concurrently. Annual boat capacity: 60,000++ boats.'
    output: '60,000++ boats/year'
  - title: boat Boat Production
    description: 'Expanded production capacity for boats utilizing additional assembly lines. Drop-stitch core bonding, digital printing, and assembly stations run concurrently.'
    output: 'Expanded boat capacity'
  - title: boat Boat & Accessory
    description: 'Multi-purpose production lines for boats and accessories. Hot-air welding stations, RF dielectric presses, and assembly workstations are reconfigured based on order mix. Annual capacity: 5,000+ units.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'Separate clean-room production area for life vests and safety equipment. Dedicated sewing, foam insertion, and testing stations. Annual life vest capacity: 50,000+ units.'
    output: '50,000+ life vests/year'


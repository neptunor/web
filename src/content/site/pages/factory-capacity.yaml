intro: Neptunor operates one of the largest dedicated inflatable boat manufacturing facilities in Qingdao, China. Our 18,000 m² factory is organized into four specialized workshops operating in parallel, giving us the capacity to produce over 60,000+ boats annually across boat and safety equipment lines.


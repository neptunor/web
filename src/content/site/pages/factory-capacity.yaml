  text: 'Factory capacity: 18,000 m² across four specialized workshops, 60,000++ boats per year, 300+ workers on two shifts, exporting to 40+ countries. MOQ is confirmed by project configuration — sample (1–2 units), pilot (20–50 units) and standard volume (90–100+ units per 150 m roll); see our MOQ & Flexible Branding Guide for the full logic. Lead time 30–45 days, samples 10–15 days.'

customization:
  tagline: Designed with You
  title: What We Develop Around Your Brief
  subtitle: 'ODM means the product is designed for you from scratch or from our platform library — these are the levers your brief controls:'
  items:
    - 'Rider profile and market — tender, air-deck dinghy, workboat, rescue, fishing or multi-purpose positioning'
    - 'Boat dimensions — length, width, thickness and volume matched to the target rider and use case'
    - 'Hull character — bow rise, tube profile, bow and stern shape tuned for stability or speed'
    - 'Material structure — drop-stitch density, PVC layer count and grade, stiffeners and rail reinforcements'
    - 'Graphics and colors — brand colors, deck art and tube branding developed in-house'
    - 'EVA foam decking — panel layout, colors and logo integration across the deck'
    - 'Accessories package — oars, pumps, seats, bailers and bags matched to the boat'
    - 'Packaging and retail presentation — retail boxes, displays and export packing under your brand'

faq_section:
  tagline: FAQ
  title: ODM Development Questions
  questions:
    - q: How does ODM differ from OEM?
      a: 'ODM (Original Design Manufacturing) starts from your brief — our engineers develop the boat structure, construction, graphics and packaging, whether from a market concept, performance target or adaptation of a proven platform. You approve the design before production. OEM (Original Equipment Manufacturing) manufactures to your approved specification — your drawings, dimensions, materials and packaging. You own the design and IP. Both run through the same plant, QC system and export team; ODM is the fastest path to a branded boat when you do not have a design yet.'
    - q: I only have a rough idea — where do we start?
      a: 'Send a short brief: target operators, use cases, rough size, markets and volumes. Our engineers come back with a concept, a reference boat direction and a development plan within one business day — an NDA is signed before any detailed exchange when requested.'
    - q: How long does it take to develop a new boat?
      a: 'Prototype samples ship in 10–15 days. A new hull with custom mould tooling adds 20–35 days of engineering before samples. Production runs 30–45 days after PO and deposit.'
    - q: What is the MOQ for an ODM boat?
      a: 'Standard volume production runs 90–100 units per 150 m fabric roll batch; pilot runs start at 20–50 units on existing platforms. Small-batch co-branding starts at 5–10 units — see our MOQ & Flexible Branding Guide for the full calculation.'
    - q: Who owns the design and mould?
      a: 'Your brief, design and tooling are protected by NDA, brand licensing terms and mould ownership or buyout clauses written into the contract. Tooling is kept for your brand and transferable.'
    - q: Can you develop a specific shape (tenders, fishing, rescue, workboats)?
      a: 'Yes. Hull engineering covers all main boat categories — tender, air-deck dinghy, workboat, rescue, fishing and multi-person boats — with hydrodynamic test-tank validation available for performance shapes.'
    - q: Which certifications will the developed boat carry?
      a: 'CE (recreational craft directive), ISO 9001, BSCI, REACH and RoHS. Certification documents are prepared per order for your export markets, and ISO 6185 compliance applies to inflatable boats.'

process:
  title: The ODM Process — From Brief to Scaled Production
  subtitle: 'Six controlled stages run by the same in-house team that designs, samples and scales your boat — everything stays documented.'
  steps:
    - phase: '01'
      title: Brief & Concept
      period: 1 business day
      items:
        - 'Share target applications, use cases, sizes, markets and volumes — or just an idea.'
        - 'Our engineers return a concept direction, platform options and a development plan.'
    - phase: '02'
      title: Hull & Structure Design
      period: Week 1–2
      items:
        - 'Boat dimensions, hull character, drop-stitch density and PVC structure engineered in-house.'
        - 'Graphics, EVA deck layout and packaging concept developed around your brand.'
    - phase: '03'
      title: Mould & Tooling
      period: +15–20 days (new shapes)
      items:
        - 'Custom mould tooling designed and cut for new hull shapes; existing platforms skip this stage.'
        - 'Tooling ownership terms are fixed in the contract before cutting starts.'
    - phase: '04'
      title: Prototype & Sample
      period: 10–15 days
      items:
        - 'A physical prototype is built, tested and sent for your review — runway trials included.'
        - 'Sample (1–2 units) validates shape, structure and branding before volume.'
    - phase: '05'
      title: Validation & Approval
      period: In parallel
      items:
        - 'Air-retention, pressure-hold, seam-strength, load and UV checks per production line.'
        - 'CE, ISO 9001, BSCI, REACH and RoHS documentation prepared for your export markets.'
        - 'You approve the prototype; PO and deposit lock the production slot.'
    - phase: '06'
      title: Production & Delivery
      period: 30–45 days
      items:
        - 'Standard-volume batches run 90–100+ units per 150 m roll, pilot runs from 20–50 units.'
        - 'Export packing, FOB/CIF/DDP shipping to 40+ countries and reorder support included.'


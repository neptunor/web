answer:
  label: 'Straight answer'
  text: 'ODM development starts from your brief, not your drawings: hull design (length, beam, bow rise, volume), material structure and graphics are engineered in-house, validated by prototype samples in 10–15 days, and produced at standard volume MOQ of 90–100 units per 150 m roll batch (pilot from 20–50 units). Production runs 30–45 days after confirmed PO and deposit; custom mould tooling adds 20–35 days. CE, ISO 9001, BSCI, REACH and RoHS documentation ships with every order.'
  verified: '2026-08'


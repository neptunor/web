workshops:
  - title: Producción de RIB y embarcaciones hinchables
    description: '4 líneas de ensamblaje automatizadas para RIB y embarcaciones hinchables. Las estaciones de impresión digital y serigrafía funcionan simultáneamente; la capacidad anual se programa según la mezcla de productos aprobada.'
    output: 'Hasta 60.000 embarcaciones/año'
  - title: Preparación y montaje de embarcaciones
    description: 'Las líneas de montaje se programan para RIB y embarcaciones hinchables según el pedido aprobado. La unión de núcleos drop-stitch, la impresión digital y las estaciones de ensamblaje funcionan en paralelo.'
    output: 'Capacidad de embarcación ampliada'
  - title: Montaje y embalaje de embarcaciones
    description: 'Las áreas flexibles de producción y embalaje se adaptan a los pedidos de RIB y embarcaciones inflables. Las estaciones de soldadura, montaje, inspección y embalaje de exportación se programan según la mezcla de pedidos aprobada.'
    output: 'Programado según la mezcla de productos'

oem_capacity:
  moq: 'embarcación: muestra 1–2 | piloto 20–50 | volumen 90–100+ por configuración aprobada'
  lead_time: 'Estándar de 30–45 días. Muestras en 10–15 días. Acelerado disponible.'
  payment: 'T/T 30% de depósito + 70% de saldo. Se aceptan L/C y Western Union.'

lead_time_explainer:
  tagline: 'Planificación y programación'
  title: 'Cómo se traduce la capacidad en tu entrega'
  subtitle: 'La capacidad no es un número único: así se asignan realmente los plazos.'
  items:
    - title: 'La capacidad varía según tu especificación'
      body: 'Los huecos disponibles cambian según el tipo de embarcación, la complejidad de construcción, el packaging y la demanda estacional. Durante el pico de primavera/verano, las líneas están al máximo y los huecos de muestras se reservan primero.'
    - title: 'Planifica antes de tu temporada de lanzamiento'
      body: 'Fija pronto la confirmación de muestras y el cierre de arte. Los pedidos repetidos se programan en tu hueco recurrente acordado una vez archivada la muestra dorada.'
    - title: 'Tres vías de programación'
      body: 'Las muestras entran primero en la línea de prototipos, los pedidos iniciales se colocan en la ventana de ensamblaje abierta más próxima y los pedidos repetidos se ejecutan en su hueco recurrente.'
    - title: 'Plazos firmes tras la revisión'
      body: 'Confirmamos un plazo firme solo después de revisar especificación, arte, packaging y cantidad — nunca como una promesa fija a priori.'

cta:
  title: 'Comprueba la disponibilidad de producción para tu fecha de lanzamiento'
  subtitle: 'Envía tu tipo de embarcación, cantidad y fecha de lanzamiento objetivo — respondemos con la próxima ventana de producción abierta y una estimación de plazo firme.'
  actions:
    - variant: primary
      text: Comprobar disponibilidad

  description: 'La capacidad de la fábrica de Neptunor: 18.000 m² que producen hasta 60.000 embarcaciones al año. Fabricación OEM/ODM a gran escala.'
  dateModified: '2026-08-07'
  keywords:
    - 'capacidad de producción de embarcación'
    - 'fábrica de embarcaciones hinchables'

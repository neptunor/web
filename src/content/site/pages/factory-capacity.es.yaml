hero:
  tagline: Capacidad de producción
  title: Capacidad de fabricación y producción anual
  subtitle: 'Instalación de 18.000 m² que produce hasta 60.000 embarcaciones al año, con margen para escalar'

answer:
  label: 'Respuesta directa'
  text: 'Capacidad de la fábrica: 18.000 m² repartidos en cuatro talleres especializados, hasta 60.000 embarcaciones al año, más de 300 trabajadores en dos turnos y exportación a más de 40 países. El MOQ se confirma según la configuración del proyecto — muestra (1–2 unidades), piloto (20–50 unidades) y volumen estándar (90–100+ unidades por configuración aprobada); consulta nuestra Guía de MOQ y Branding Flexible para la lógica completa. Plazo de entrega de 30–45 días y muestras en 10–15 días.'
  verified: '2026-08'

intro: Neptunor opera una de las instalaciones dedicadas más grandes de fabricación de embarcaciones hinchables en Qingdao, China. Nuestra fábrica de 18.000 m² está organizada en cuatro talleres especializados que trabajan en paralelo, lo que nos da la capacidad de producir hasta 60.000 embarcaciones al año, según la mezcla de productos.


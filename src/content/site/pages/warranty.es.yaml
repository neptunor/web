seo:
  headline: 'Garantía y soporte posventa para RIB y embarcaciones inflables | Neptunor'
  description: 'Conoce cómo estructura Neptunor la garantía B2B, las reclamaciones por defectos, los repuestos y el soporte de servicio para RIB y embarcaciones inflables.'
  datePublished: '2026-09-03'
  dateModified: '2026-09-03'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Neptunor suministra RIB y embarcaciones inflables a marcas, distribuidores, flotas y operadores profesionales. Esta página es un resumen de planificación y no sustituye las condiciones de garantía y posventa incluidas en la cotización, la orden de compra y el contrato de suministro de tu proyecto.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Qué se acuerda en cada proyecto</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Alcance</h3>
        <p class="text-sm text-gray-600 mt-1">Componentes cubiertos, defectos de fabricación, exclusiones y límites para equipos de terceros.</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Duración</h3>
        <p class="text-sm text-gray-600 mt-1">El periodo de garantía se confirma según el modelo, el mercado de destino, el contrato y el uso previsto.</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Evidencias</h3>
        <p class="text-sm text-gray-600 mt-1">Se requieren referencia de serie o WIN/HIN, entrega, fotos o vídeo e información de uso para la revisión.</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Solución</h3>
        <p class="text-sm text-gray-600 mt-1">Reparación, repuesto, reproceso, sustitución, abono u otra solución contractual según corresponda.</p>
      </div>
    </div>
  </div>

  <h2>Categorías habituales de defectos de fabricación</h2>
  <p>Según la configuración aprobada y el contrato, la revisión puede cubrir defectos en costuras de tubos, válvulas, fabricación del casco, uniones, herrajes instalados en fábrica u otros trabajos. No cubre automáticamente perforaciones, impactos, abrasión, uso indebido, inflado incorrecto, modificaciones no autorizadas, almacenamiento inadecuado, desgaste normal o daños posteriores a la entrega.</p>
  <p>Los cascos de aluminio, cascos de fibra de vidrio, tubos de PVC, tubos de CSM/Hypalon, paneles air-deck, consolas y componentes de terceros pueden tener límites de servicio distintos. La especificación aprobada y el contrato determinan qué componentes están cubiertos.</p>

  <h2>Uso comercial y de flota</h2>
  <p>El uso en alquiler, resort, chárter, rescate, patrulla, formación u otros ciclos intensivos debe declararse durante la cotización. El ciclo comercial, el entorno de operación, el mantenimiento y la capacidad de servicio local pueden afectar el alcance de la garantía, las inspecciones y la planificación de repuestos. No apliques a una flota comercial las condiciones previstas para recreo privado.</p>

  <h2>Proceso de reclamación recomendado</h2>
  <ol>
    <li><strong>Identificar la embarcación:</strong> indica modelo, número de serie o WIN/HIN, pedido y fecha de entrega.</li>
    <li><strong>Describir el problema:</strong> incluye el componente afectado, historial de uso, entorno y momento en que se detectó.</li>
    <li><strong>Adjuntar evidencias:</strong> envía fotos o vídeo claros y conserva la pieza afectada cuando sea posible.</li>
    <li><strong>Permitir la revisión técnica:</strong> Neptunor compara el informe con la especificación, la BOM, las inspecciones y la trazabilidad.</li>
    <li><strong>Acordar la solución:</strong> la reparación, el repuesto, el reproceso u otra solución se registra antes de comenzar el trabajo.</li>
  </ol>

  <h2>Planificación de repuestos</h2>
  <p>Los programas de flota y distribución pueden planificar repuestos según modelo junto con el pedido original o mediante reposiciones posteriores. Según la embarcación, un paquete de servicio puede incluir válvulas compatibles, materiales de reparación de PVC o CSM, adhesivo, tramos de tubo o perfil de roce, componentes de suelo, bombas, remos, tapones, cubiertas y herrajes de consola. La lista final, compatibilidad y disponibilidad se confirman según modelo y BOM.</p>
  <p>Para una lista práctica, consulta la <a href="/es/resources/rib-after-sales-spares" class="text-sky-600 underline">guía de posventa y repuestos para RIB</a> y la <a href="/es/resources/rib-traceability-evidence" class="text-sky-600 underline">guía de evidencias de trazabilidad</a>.</p>

  <h2>Registros y control de cambios</h2>
  <p>Conserva juntos la muestra aprobada, la especificación técnica, el arte, la BOM, la revisión del manual, las referencias de serie y la lista del paquete de servicio. Si cambia una válvula, herraje, tejido, componente de consola o manual, registra y aprueba la revisión antes de liberar un pedido repetido o un repuesto.</p>
  <p>El proceso documentado de producción de Neptunor incluye registros de materiales e inspección vinculados a la serie durante el periodo indicado en la documentación del proyecto. Estos registros ayudan a revisar garantías y seleccionar repuestos, pero no sustituyen el contrato escrito.</p>

  <h2>Cómo solicitar soporte</h2>
  <p>Contacta con Neptunor o con tu contacto comercial e indica el pedido, modelo, número de serie o WIN/HIN y una descripción breve del problema. Para un nuevo programa de flota o distribución, incluye la mezcla de modelos, cantidad anual estimada, condiciones de uso, mercado objetivo y paquete de repuestos deseado.</p>
  <p>Usa el <a href="/es/contact" class="text-sky-600 underline">formulario de consulta B2B</a> para solicitar una revisión de soporte.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Esta página es un resumen comercial general. La cotización firmada, la orden de compra, el acuerdo de suministro y las condiciones de garantía del proyecto aplicable son los documentos que rigen. Las especificaciones y los acuerdos de servicio pueden cambiar tras una revisión por escrito.
  </p>

  text: 'El drop stitch es un tejido cuyos pilares de hilo de poliéster mantienen las capas superior e inferior de PVC a una distancia fija, de modo que la presión de aire vuelve rígido el panel. Neptunor lo utiliza para suelos air-deck y paneles de asiento en dinghies neumáticos y auxiliares RIB: 1.680 DTEX, 2 hilos por pulgada cuadrada, laminado exterior de PVC de 1,2 mm, validado con una prueba de retención de 24 horas a 0,35 bar.'

content_html: |
  <h2>¿Qué Es el Drop Stitch?</h2>
  <p>El drop stitch (también llamado "tejido drop-stitch" o "tejido de doble pared") es un método de construcción en el que miles de hilos individuales de poliéster conectan las capas superior e inferior de una carcasa de tejido. Cuando el panel se infla, estos hilos actúan como elementos internos de tensión — impiden que las capas superior e inferior se abomben hacia fuera formando un tubo, forzando al panel a mantenerse plano y rígido.</p>
  <p>El resultado es una estructura ligera y portátil que mantiene una forma fija bajo carga — una cubierta plana y caminable o una base de asiento firme que se enrolla cuando se desinfla. Esto es exactamente lo que necesita una embarcación neumática: rigidez en el agua y volumen compacto en la caja.</p>

  <h2>Cómo Funciona: La Física</h2>
  <p>En una estructura hinchable convencional (como un tubo o una defensa), la presión interna del aire empuja por igual en todas direcciones, por lo que la cámara adopta naturalmente forma cilíndrica. El drop stitch lo resuelve introduciendo refuerzo de tensión:</p>
  <ul>
    <li>Miles de hilos conectan las capas superior e inferior del tejido</li>
    <li>Al inflar, la presión del aire intenta separar arriba y abajo</li>
    <li>Los hilos resisten esa separación, transfiriendo la carga a tensión a lo largo de su eje</li>
    <li>El resultado es un panel plano y rígido que resiste la flexión bajo los pies</li>
  </ul>

  <h2>Proceso de Construcción</h2>
  <ol>
    <li><strong>Tejido:</strong> Los hilos de poliéster se tejen simultáneamente en dos capas separadas de tejido base (normalmente poliéster recubierto de PVC de 1.100 o 1.680 DTEX). Los hilos se tejen en bucle entre las capas en ángulo de 90&deg;.</li>
    <li><strong>Recubrimiento:</strong> El tejido base tejido se recubre con PVC (u ocasionalmente TPU) mediante recubrimiento por cuchilla o calandrado. Esto sella los hilos y crea la membrana estanca al aire.</li>
    <li><strong>Corte de paneles:</strong> El núcleo laminado se corta por CNC según la geometría de suelo o asiento del casco específico, de modo que el panel encaje entre el tubo y la quilla sin holguras.</li>
    <li><strong>Soldadura:</strong> Los bordes del panel y las bases de válvulas se sellan mediante soldadura de aire caliente o soldadura RF, integrando el panel en la construcción soldada de la embarcación.</li>
    <li><strong>Instalación de válvulas:</strong> Se instalan válvulas de inflado estándar, normalmente con mecanismo de alivio de presión para evitar la sobreinflación del panel.</li>
  </ol>

  <h2>Indicadores Clave de Calidad</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Parámetro</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Gama de Entrada</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Premium</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Densidad de hilos</td><td class="p-3 border">1 hilo / pulg²</td><td class="p-3 border">2 hilos / pulg²</td></tr>
      <tr><td class="p-3 border">Tejido base</td><td class="p-3 border">1.100 DTEX</td><td class="p-3 border">1.680 DTEX</td></tr>
      <tr><td class="p-3 border">Rigidez del panel</td><td class="p-3 border">Flexión de servicio bajo carga</td><td class="p-3 border">Casi rígido bajo los pies a presión de trabajo</td></tr>
      <tr><td class="p-3 border">Grosor de PVC</td><td class="p-3 border">0,6 – 0,9 mm</td><td class="p-3 border">1,0 – 1,2 mm</td></tr>
      <tr><td class="p-3 border">Construcción de bordes</td><td class="p-3 border">Doblado y pegado</td><td class="p-3 border">Soldado y fusionado</td></tr>
    </tbody>
  </table>

  <h2>Aplicaciones en Embarcaciones Neumáticas</h2>
  <ul>
    <li><strong>Suelos air-deck:</strong> Los dinghies y auxiliares enrollables utilizan suelos drop-stitch como superficie de pisada — una cubierta firme y plana que sustituye a los suelos de listones de madera con una fracción del peso.</li>
    <li><strong>Suelos y pozos de pies en RIB:</strong> Los paneles drop-stitch sirven como cubiertas interiores ligeras, plataformas de pesca e insertos de pozo de pie en auxiliares RIB más grandes.</li>
    <li><strong>Bases de asiento y bancos:</strong> Paneles de asiento rígidos con retención de presión que permanecen planos bajo el peso de la tripulación y se guardan planos dentro de la bolsa de la embarcación.</li>
    <li><strong>Defensas y estructuras de atraque:</strong> Drop stitch de baja presión para defensas conformadas con caras planas.</li>
  </ul>

  <h2>Drop Stitch Frente a Suelos de Madera Contrachapada o Aluminio</h2>
  <p>Las neumáticas tradicionales utilizan suelos segmentados de madera contrachapada o aluminio: rígidos y probados, pero pesados, ruidosos y incómodos de empacar. Un air-deck de drop stitch cambia un poco de rigidez por grandes ganancias en peso, tiempo de montaje y volumen embalado — una sola persona puede desplegar la cubierta e inflarla en minutos. Para flotas comerciales de alquiler y auxiliares de yates, la menor fatiga de la tripulación y la rotación más rápida suelen pesar más que la diferencia de rigidez.</p>

  <h2>Cómo Usa Neptunor el Drop Stitch</h2>
  <p>Neptunor construye sus suelos air-deck y paneles de asiento con un núcleo drop-stitch de 1.680 DTEX, 2 hilos por pulgada cuadrada y laminado exterior de PVC de 1,2 mm. Los paneles se cortan por CNC según la geometría de suelo de cada casco, los bordes se sueldan por fusión triple con aire caliente, y cada embarcación terminada — tubos y air-deck juntos — supera una prueba de retención de presión de 24 horas a 0,35 bar antes del envío, con presión de trabajo de tubo fijada en 0,25 bar.</p>
  <p>El drop stitch es uno de los pilares de nuestra construcción naval — vea la <a href="/es/technology">descripción general de tecnología</a> y cómo se integran los paneles en la <a href="/es/factory">línea de producción de la fábrica</a>.</p>


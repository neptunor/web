seo:
  headline: 'RIB & Inflatable Boat Warranty and After-Sales Support | Neptunor'
  description: 'Understand how Neptunor structures B2B warranty, defect claims, spare parts and service support for RIB boats and inflatable boats.'
  datePublished: '2026-09-03'
  dateModified: '2026-09-03'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Neptunor supplies RIB boats and inflatable boats to brands, distributors, fleets and professional operators. This page is a planning summary, not a substitute for the warranty and after-sales terms written into the quotation, purchase order and supply contract for your project.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">What is agreed for each project</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Scope</h3>
        <p class="text-sm text-gray-600 mt-1">Covered components, manufacturing defects, exclusions and any third-party equipment boundary.</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Duration</h3>
        <p class="text-sm text-gray-600 mt-1">The warranty period is confirmed by model, destination market, contract and intended use.</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Evidence</h3>
        <p class="text-sm text-gray-600 mt-1">Serial or WIN/HIN reference, delivery details, photos or video and operating information required for review.</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">Remedy</h3>
        <p class="text-sm text-gray-600 mt-1">Repair, replacement part, rework, replacement boat, credit or another contractual remedy as applicable.</p>
      </div>
    </div>
  </div>

  <h2>Typical manufacturing-defect categories</h2>
  <p>Depending on the approved configuration and contract, the review may cover defects in tube seams, valves, hull fabrication, bonding, factory-installed fittings or other workmanship. It does not automatically cover punctures, impact, abrasion, misuse, incorrect inflation, unauthorized modification, unsuitable storage, normal wear or damage caused after delivery.</p>
  <p>Aluminum hulls, fiberglass hulls, PVC tubes, CSM/Hypalon tubes, air-deck panels, consoles and third-party components may have different service boundaries. The approved specification and contract control which components are covered.</p>

  <h2>Commercial and fleet use</h2>
  <p>Rental, resort, charter, rescue, patrol, instructional and other high-cycle use must be disclosed during quotation. Commercial duty cycles, operating environment, maintenance arrangements and local service capability may affect warranty scope, inspection requirements and spare-parts planning. Do not apply a private-recreation warranty assumption to a commercial fleet.</p>

  <h2>Recommended claim process</h2>
  <ol>
    <li><strong>Identify the boat:</strong> provide the model, serial or WIN/HIN reference, order number and delivery date.</li>
    <li><strong>Describe the issue:</strong> include the affected component, operating history, environment and when the issue was discovered.</li>
    <li><strong>Attach evidence:</strong> send clear photos or video and preserve the affected part where practical.</li>
    <li><strong>Allow technical review:</strong> Neptunor compares the report with the approved specification, BOM, inspection records and traceability data.</li>
    <li><strong>Agree the remedy:</strong> repair, replacement, rework or another remedy is recorded before work begins.</li>
  </ol>

  <h2>Spare-parts planning</h2>
  <p>Fleet and dealer programs can plan model-matched service parts with the original order or through later replenishment. Depending on the boat, a service package may include compatible valves, PVC or CSM repair materials, adhesive, tube or rubbing-strake sections, floor components, pumps, oars, drain plugs, covers and console hardware. The final list, compatibility and availability are confirmed per model and BOM.</p>
  <p>For a practical checklist, see the <a href="/resources/rib-after-sales-spares" class="text-sky-600 underline">RIB after-sales and spare-parts guide</a> and the <a href="/resources/rib-traceability-evidence" class="text-sky-600 underline">traceability evidence guide</a>.</p>

  <h2>Records and change control</h2>
  <p>Keep the approved sample, technical specification, artwork, BOM, manual revision, serial references and service-pack list together. If a valve, fitting, fabric, console component or manual changes, record and approve the revision before releasing a repeat order or replacement part.</p>
  <p>Neptunor’s documented production process includes serial-linked inspection and material records for the retention period stated in the project documentation. These records support warranty review and replacement-part matching; they do not replace the written contract.</p>

  <h2>How to request support</h2>
  <p>Contact Neptunor or your commercial account contact with the order number, model, serial or WIN/HIN reference and a concise description of the issue. For a new fleet or dealer program, include the model mix, estimated annual quantity, operating conditions, target market and desired spare-parts package.</p>
  <p>Use the <a href="/contact" class="text-sky-600 underline">B2B inquiry form</a> for a new service-support review.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    This page is a general commercial summary. The signed quotation, purchase order, supply agreement and warranty terms for the applicable project govern. Specifications and service arrangements are subject to change after written review.
  </p>

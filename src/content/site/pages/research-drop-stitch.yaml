  <h2>Applications in Inflatable Boats</h2>
  <ul>
    <li><strong>Air-deck floors:</strong> Roll-up dinghies and tenders use drop-stitch floors as the walking surface — a firm, flat deck that replaces slatted wood floors at a fraction of the weight.</li>
    <li><strong>RIB floors and footwells:</strong> Drop-stitch panels serve as lightweight interior decks, casting platforms and footwell inserts in larger RIB tenders.</li>
    <li><strong>Seat bases and benches:</strong> Rigid, pressure-held seat panels that stay flat under crew weight and stow flat inside the boat bag.</li>
    <li><strong>Fenders and dock structures:</strong> Low-pressure drop stitch for shaped fenders with flat faces.</li>
  </ul>

  <h2>Drop Stitch vs. Plywood or Aluminum Floors</h2>
  <p>Traditional inflatables use segmented plywood or aluminum floorboards: stiff and proven, but heavy, rattly and awkward to pack. A drop-stitch air-deck trades a small amount of stiffness for major gains in weight, setup time and packed volume — one person can roll the deck out and inflate it in minutes. For commercial rental fleets and yacht tenders, the reduced crew strain and faster turnaround usually outweigh the stiffness difference.</p>

  <h2>How Neptunor Uses Drop Stitch</h2>
  <p>Neptunor builds its air-deck floors and seat panels from a 1,680 DTEX drop-stitch core with 2 threads per square inch and a 1.2 mm PVC outer laminate. Panels are CNC-cut to each hull's floor geometry, edge-welded with hot-air triple-layer fusion, and every finished boat — tubes and air-deck together — passes a 24-hour pressure hold test at 0.35 bar before shipment, with tube working pressure set at 0.25 bar.</p>
  <p>Drop-stitch is one pillar of our boat construction — see the <a href="/technology">technology overview</a> and how panels are integrated on the <a href="/factory">factory production line</a>.</p>


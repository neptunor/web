answer:
  label: 'Straight answer'
  text: 'Drop-stitch is a fabric whose pillars of polyester thread hold the top and bottom PVC layers a fixed distance apart, so air pressure turns the panel rigid. Neptunor uses it for air-deck floors and seat panels in inflatable dinghies and RIB tenders: 1,680 DTEX, 2 threads per square inch, 1.2 mm PVC outer laminate, validated by a 24-hour hold test at 0.35 bar.'
  verified: '2026-08'


  text: 'We turn a CAD model into a water-ready, tested sample boat in 10–15 days: inflatable prototyping, on-water chop runs, tube and bow iterations, then production tooling commitment. Full custom moulds take 15–20 days of tooling on top of the standard 30–45 day bulk lead time.'

meta:
  title: 'Guía de documentación de cumplimiento RIB — RCD, CE y expediente técnico | Neptunor'
  description: 'Cómo revisar la documentación de cumplimiento de RIB y embarcaciones inflables: definición del modelo, alcance RCD, expediente técnico, ensayos, placa del constructor, WIN/HIN, manual y Declaración UE de Conformidad.'
  dateModified: '2026-09-03'
  keywords:
    - 'documentación de cumplimiento RIB'
    - 'expediente técnico RCD RIB'
    - 'lista de documentos CE RIB'
    - 'Declaración UE de Conformidad RIB'


hero:
  tagline: Tecnología
  title: Diseñado para el rendimiento
  subtitle: 'Cada embarcación hinchable Neptunor se fabrica con construcción drop-stitch y PVC de grado marino: materiales de precisión y métodos de fabricación probados en entornos marinos exigentes.'

sections:
  - title: Núcleo Drop-Stitch
    description: Miles de hilos internos de poliéster conectan las capas superior e inferior, creando una estructura rígida a 0.25 bar working pressure. Es la misma tecnología que usan las embarcaciones profesionales y las embarcaciones de competición hinchables.
    imageAlt: Diagrama núcleo DS
  - title: PVC de grado marino
    description: Tejido de PVC laminado multicapa apto para entornos marinos. Cada capa se fusiona por soldadura en lugar de pegarse, lo que elimina los riesgos de delaminación. Ensayado contra rayos UV, corrosión por agua salada y abrasión.
    imageAlt: Capa de PVC
  - title: PVC de grado militar
    description: Utilizado en todos los modelos de embarcación, este PVC premium ofrece resistencia superior a los rayos UV y a los productos químicos. Mantiene la flexibilidad en temperaturas extremas y resiste la degradación.
    imageAlt: PVC
  - title: Cubierta Air Deck
    description: Construcción hinchable de alta presión con drop stitch que aporta una rigidez excepcional para cubiertas transitables, plataformas de pesca y asientos. Reduce el tiempo de montaje, el peso total y el volumen de almacenamiento.
    imageAlt: Air Deck


  description: 'How buyers should review RIB and inflatable boat compliance documentation: model definition, RCD scope, technical files, testing, builder’s plate, WIN/HIN, owner’s manual and EU Declaration of Conformity.'
  dateModified: '2026-09-03'
  keywords:
    - 'RIB compliance documentation'
    - 'RIB RCD technical file'
    - 'RIB CE document checklist'
    - 'EU Declaration of Conformity RIB'


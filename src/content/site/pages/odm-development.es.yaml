hero:
  tagline: Desarrollo ODM
  title: 'Desarrollo ODM de embarcación — De tu idea a una embarcación lista para el mercado'
  subtitle: '¿Aún no tienes planos? Nuestros ingenieros diseñan el casco, la estructura, la gráfica y el embalaje alrededor de tu brief — y luego fabrican, prueban y producen en serie. Prototipos en 10–15 días, producción en 30–45 días tras confirmar el pedido.'

answer:
  label: 'Respuesta directa'
  text: 'El desarrollo ODM parte de tu brief, no de tus planos: el diseño del casco (largo, manga, arrufo de proa, volumen), la estructura del material y la gráfica se ingenian en casa, se validan con muestras de prototipo en 10–15 días y se producen con un MOQ de volumen estándar de 90–100 unidades por lote de rollo de 150 m (pilotos desde 20–50 unidades). La producción corre en 30–45 días tras confirmar el pedido y el depósito; el utillaje de molde a medida añade 20–35 días. Con cada pedido se envía documentación CE, ISO 9001, BSCI, REACH y RoHS.'
  verified: '2026-08'


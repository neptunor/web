hero:
  tagline: 'About Neptunor'
  title: 'One Factory. One Brand. Every Boat Built for You.'
  subtitle: 'Neptunor is the B2B boat-manufacturing brand of Neptunor Marine Co., Ltd. — an 18,000 m² RIB and inflatable boat plant in Qingdao, Shandong, China, built for brands, dealers and fleet operators.'

intro:
  - Neptunor exists to make professional boat manufacturing simple. Under one legal entity — Neptunor Marine Co., Ltd. — we run an 18,000 m² production campus in Qingdao with four specialized workshops and four automated lines, producing more than 60,000 boats a year for partners in 40+ export countries.
  - We are engineers and boatbuilders first. Design, hull engineering, RF welding, console finishing, assembly, testing and export documentation all happen under our own roof, so every commitment we make is one we control.


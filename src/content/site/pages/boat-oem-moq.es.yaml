meta:
  title: 'MOQ y Plazo de Embarcaciones a Medida — Niveles, Plazos y Factores de Coste | Neptunor'
  description: 'Marco de MOQ y plazos para pedidos de embarcaciones RIB y neumáticas personalizadas en Neptunor: niveles de muestra, co-branding, piloto y volumen, cronogramas de producción y factores reales de coste.'
  dateModified: '2026-08-21'
  keywords:
    - 'MOQ embarcaciones personalizadas'
    - 'plazo OEM embarcaciones neumáticas'
    - 'MOQ auxiliar RIB'
    - 'cronograma fabricación embarcaciones'

hero:
  tagline: 'MOQ y Plazo'
  title: 'MOQ y Plazo de Embarcaciones Personalizadas'
  subtitle: 'Un marco de niveles transparente para los programas de embarcaciones de Neptunor — desde las primeras muestras hasta contenedores completos — con plazos honestos y los factores de coste que los mueven.'

answer:
  label: 'Respuesta directa'
  text: 'Neptunor trabaja con cinco niveles de MOQ: muestras de 1–2 embarcaciones, co-branding 5–10, tiradas piloto 20–50, volumen estándar 90–100+ por configuración (un ciclo completo de rollo de tejido) y programas de utillaje nuevo de casco/consola desde 50–100+. Las muestras salen en 10–15 días tras la congelación de especificaciones; la producción estándar lleva 30–45 días desde PO confirmada y depósito. El utillaje nuevo de casco o consola añade 20–35 días antes de la producción en serie.'
  verified: '2026-08'


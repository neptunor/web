cost_drivers:
  tagline: 'Qué Mueve Tu Precio'
  title: 'Factores de Coste Detrás de Cada Cotización'
  subtitle: 'Cuatro factores determinan la economía del MOQ y el coste unitario final.'
  features:
    - icon: F
      icon_bg: blue
      title: 'Rendimiento del Lote de Tejido'
      desc: 'La eslora, el diámetro del tubo y la eficiencia de anidado deciden cuántos cascos rinde un rollo de tejido PVC de 150 m. Embarcaciones más largas y tubos más anchos reducen el rendimiento por rollo y elevan el MOQ práctico por configuración.'
    - icon: C
      icon_bg: green
      title: 'Utillaje de Consola y Casco'
      desc: 'Las consolas personalizadas o los cascos de fibra de vidrio/RIM requieren utillaje dedicado — cotizado aparte, amortizado en la primera tirada, y que añade 20–35 días antes de iniciar la producción.'
    - icon: A
      icon_bg: purple
      title: 'Paquete de Accesorios'
      desc: 'Remos o palas, bombas, asientos, ruedas, kits de reparación y electrónica de consola añaden líneas al BOM. Los kits de accesorios compartidos entre modelos reducen el coste unitario y el inventario.'
    - icon: P
      icon_bg: orange
      title: 'Embalaje y Exportación'
      desc: 'Cajas minoristas, marcado de códigos de barras, planes de carga de contenedor e incoterms (FOB Qingdao por defecto) se fijan en la cotización para que el precio planificado sea el que se envía.'

timeline:
  title: 'Cronograma de Extremo a Extremo'
  steps:
    - title: 'Congelación de especificaciones'
      description: 'Planos, BOM, arte de marca y objetivos de certificación confirmados y firmados. Días 0–3.'
    - title: 'Muestreo'
      description: 'Primeras unidades construidas y enviadas en 10–15 días para tu inspección y prueba en el agua.'
    - title: 'Utillaje (si aplica)'
      description: 'Moldes de casco o consola producidos en paralelo con la planificación piloto — solo añade 20–35 días en programas con utillaje nuevo.'
    - title: 'Producción'
      description: '30–45 días desde la confirmación de PO y depósito: QC de material entrante, soldadura, montaje, 120 puntos de control y retenciones de presión de 24 h a 0,35 bar.'
    - title: 'Liberación de envío'
      description: 'Inspección previa al embarque, carga de contenedor y documentación de exportación desde el Puerto de Qingdao.'

faqs:
  tagline: Preguntas Frecuentes
  title: 'MOQ y Plazo — Preguntas Frecuentes'
  items:
    - q: '¿Puedo pedir menos de 90 embarcaciones?'
      a: 'Sí. Los niveles de muestra, co-branding y piloto existen precisamente para eso. La mayoría de las marcas nuevas empieza con un lote de co-branding de 5–10 embarcaciones sobre un casco probado y escala a configuraciones completas de 90–100+ cuando el mercado lo valida.'
    - q: '¿Por qué el MOQ "estándar" sigue al rollo de tejido?'
      a: 'El tejido de tubo se compra y corta en rollos madre de 150 m. Una configuración se precioa por rendimiento de rollo completo — normalmente 90–100+ dinghies según eslora y diámetro de tubo — por eso el nivel de volumen se expresa por configuración y no como una cifra única.'
    - q: '¿Cómo de rápido puede salir un pedido repetido?'
      a: 'Los pedidos repetidos con especificaciones congeladas y huecos de material reservados suelen quedar en el extremo rápido de la ventana de 30–45 días, porque las puertas de muestreo, utillaje y aprobación ya están superadas.'
    - q: '¿El coste de utillaje aplica a todos los proyectos?'
      a: 'No. Solo aplica cuando necesitas una forma de casco nueva, molde de consola o cambio estructural fuera de nuestras plataformas validadas. Cuando aplica, la tarifa se amortiza en la primera tirada de producción y se indica por escrito en la cotización.'


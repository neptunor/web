hero:
  tagline: 'Sobre Neptunor'
  title: 'Una Fábrica. Una Marca. Cada Embarcación Construida Para Ti.'
  subtitle: 'Neptunor es la marca B2B de fabricación de embarcaciones de Neptunor Marine Co., Ltd. — una planta de RIB y neumáticas de 18.000 m² en Qingdao, Shandong, China, creada para marcas, concesionarios y operadores de flota.'

intro:
  - Neptunor existe para simplificar la fabricación profesional de embarcaciones. Bajo una única entidad legal — Neptunor Marine Co., Ltd. — operamos un campus de producción de 18.000 m² en Qingdao con cuatro talleres especializados y cuatro líneas automatizadas, produciendo más de 60.000 embarcaciones al año para socios en más de 40 países de exportación.
  - Somos ingenieros y constructores navales ante todo. El diseño, la ingeniería de cascos, la soldadura RF, el acabado de consolas, el montaje, las pruebas y la documentación de exportación ocurren todos bajo nuestro propio techo, así que cada compromiso que asumimos es uno que controlamos.


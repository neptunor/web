  text: 'boat product development at Neptunor runs six stages — product specification, structural engineering, prototype sampling, testing and validation, custom tooling, and mass production. The first physical sample ships 10–15 days after specification approval; production runs 30–45 days after confirmed PO and deposit; new mould development adds 20–35 days.'

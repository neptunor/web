faq_section:
  tagline: FAQ
  title: 'boat Development Frequently Asked Questions'
  questions:
    - q: Can you develop a boat product from an idea?
      a: 'Yes. We support the full journey from product specification and engineering through prototype development, customization and mass production based on your requirements. A sketch, a reference boat or even a competitor specification is enough to start the engineering review.'
    - q: What does boat product development cost?
      a: 'The specification review and engineering assessment are free and returned within one business day. Prototype sampling is quoted per project after the spec is fixed; production pricing depends on materials, volume and whether custom tooling is required.'
    - q: How long does boat product development take?
      a: 'The first sample ships 10–15 days after specification approval, with 3–7 days per revision round. Production runs 30–45 days after PO and deposit. Custom mould development adds 20–35 days up front, and sea freight adds 4–6 weeks to most destinations.'
    - q: What comes first — sample or production?
      a: 'Always the sample. A physical prototype is produced, measured and approved against the specification before any production run starts. We do not run bulk production on unapproved designs.'
    - q: Do you sign an NDA for product development?
      a: 'Yes. An NDA is signed before any file exchange, and your designs, artwork and tooling remain your property throughout development and manufacturing.'
    - q: Can you protect my boat design and specifications?
      a: 'Customer designs, specifications and product concepts are handled confidentially during development and manufacturing. Your tooling files are never reused, resold or shown to another client.'


what_we_need:
  heading: 'Lista de Intake — Qué Preparar'
  body: |
    Cuanto más completo sea tu brief, menos rondas de cotización. Prepara estos siete puntos:

    - **Mercado objetivo** — país o región de venta; define el alcance de certificación (Directiva Europea de Embarcaciones de Recreo 2013/53/EU categorías C/D, ISO 6185, registros locales).
    - **Tipo de embarcación** — auxiliar RIB, dinghy air-deck, bote de rescate/trabajo, modelo de flota de alquiler o un concepto personalizado.
    - **Tamaño** — eslora y manga objetivo, capacidad de pasajeros y diámetro de tubo si lo conoces.
    - **Cantidad** — estimación del primer pedido y proyección a 12 meses, para recomendar el nivel de MOQ adecuado.
    - **Necesidades de certificación** — categoría CE, inspecciones de terceros (SGS/TÜV/BV/Intertek) o documentación específica del mercado.
    - **Marca** — ubicación del logo, gráficos del casco, branding de consola, embalaje y manuales.
    - **Cronograma** — fecha requerida de muestra y ventana de lanzamiento, incluidos plazos de ferias.

faqs:
  tagline: Preguntas Frecuentes
  title: 'Iniciar un Proyecto — Preguntas Frecuentes'
  items:
    - q: '¿Necesito planos finales antes de contactaros?'
      a: 'No. Una descripción clara del tipo de embarcación, tamaño, cantidad y mercado basta para una primera revisión de ingeniería y una cotización presupuestaria. Los planos pueden desarrollarse juntos en modo ODM o suministrarse después en modo OEM.'
    - q: '¿Qué rapidez de respuesta tengo?'
      a: 'Cada brief recibe una respuesta revisada por ingeniería en un día laborable, seguida de una cotización detallada normalmente en tres días laborables una vez clara la configuración.'
    - q: '¿Pueden firmar un NDA antes de compartir diseños?'
      a: 'Sí. Firmamos NDAs antes de recibir cualquier plano, arte o especificación propietaria, y todos los archivos del proyecto se almacenan en sistemas con control de acceso y trazabilidad de auditoría.'
    - q: '¿Quién posee el diseño?'
      a: 'En modo OEM, tú — por completo. En modo ODM, la propiedad de la plataforma adaptada a partir de tu brief se acuerda antes de empezar. En marca privada, la plataforma sigue siendo nuestra mientras todos los activos de marca siguen siendo tuyos.'


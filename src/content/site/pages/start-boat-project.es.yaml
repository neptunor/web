  text: 'Envíanos el brief de tu proyecto a través del formulario de contacto o por email a info@neptunor.com. En un día laborable recibes una respuesta revisada por ingeniería; en tres, una recomendación de nivel, precios orientativos y un plan de muestreo. Las muestras salen en 10–15 días tras la congelación de especificaciones.'

hero:
  tagline: B2B Client Solutions
  title: '24 B2B Solutions Matched to Your Business'
  subtitle: 'From startup founders to global distributors — find the exact Neptunor solution designed for your business model, industry, and goals.'
  image:
    src: https://assets.neptunor.com/site/images/boats/factory/neptunor-factory-aerial-1.webp

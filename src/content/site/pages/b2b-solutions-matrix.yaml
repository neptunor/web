answer:
  label: 'Straight answer'
  text: 'One factory serves every B2B route: OEM/ODM manufacturing with project-confirmed MOQ (sample 1–2 units, pilot 20–50, standard volume 90–100+ per 150 m roll; co-branding from 5–10 units), private label on proven platforms, wholesale distribution and fleet programs for resorts, clubs and schools. Every customer type maps to a specific solution set — samples in 10–15 days, production 30–45 days after PO and deposit.'
  verified: '2026-08'

